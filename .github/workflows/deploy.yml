name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare blank homepage
        run: |
          mkdir -p "$RUNNER_TEMP/blank-homepage"
          cp .github/pages/index.html "$RUNNER_TEMP/blank-homepage/index.html"
          touch "$RUNNER_TEMP/blank-homepage/.nojekyll"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/blank-homepage

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
